name: Railway Healthcheck (slack-applied-action)

# Railway 에 배포된 slack-applied-action 서비스의 /health 엔드포인트를 주기적으로 ping,
# 그 결과를 healthchecks.io 로 옮긴다.
#
# 이 서비스는 Slack 버튼을 받는 이벤트 구동형이라 주기 작업이 없다 — 앱이 스스로
# 하트비트를 찍을 자연스러운 시점이 없다. 대신 이 워크플로가 밖에서 HTTP 로 찔러 보고
# 그 결과를 핑으로 옮긴다. "프로세스가 살아 있나" 보다 "요청에 응답하나" 를 확인하므로
# 더 강한 신호다.
#
# Slack 직접 알림은 제거했다. 알림 경로를 healthchecks.io 한 곳으로 모으면
#   · 통보 채널을 거기서 한 번만 설정하면 되고 (Email/Slack/Webhook)
#   · 개발팀 대시보드가 같은 상태를 이력과 함께 보여준다
#     (dev-part-dashboard 의 RAILWAY_HEARTBEATS: site-monitoring → Site Monitoring Ping Check)
# ⚠️ healthchecks.io 쪽에 알림 채널을 붙여야 실제 통보가 간다. 안 붙이면 대시보드에만 뜬다.
#
# Secrets:
#   RAILWAY_HEALTH_URL  — 예: https://<service>.up.railway.app/health
#   HEALTHCHECKS_PING_URL — healthchecks.io 체크의 ping URL. 미설정이면 핑을 건너뛴다
#                           (헬스체크 자체는 그대로 동작 — 설정 전에 배포해도 무해)

on:
  schedule:
    - cron: "0 0 * * *"   # daily 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Railway /health
        id: ping
        env:
          URL: ${{ secrets.RAILWAY_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::RAILWAY_HEALTH_URL secret 미설정"
            exit 1
          fi
          echo "Pinging: $URL"
          # 10초 timeout, HTTP 4xx/5xx 도 실패로 간주(-f).
          if curl -fsS --max-time 10 "$URL" -o /tmp/body; then
            BODY="$(cat /tmp/body)"
            echo "✅ healthy (body=$BODY)"
            echo "status=ok" >> "$GITHUB_OUTPUT"
            echo "body=$BODY" >> "$GITHUB_OUTPUT"
          else
            EXIT=$?
            echo "::error::❌ unhealthy (curl exit=$EXIT)"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # 성공/실패를 healthchecks.io 로 옮긴다. always() 라서 위 스텝이 실패해도 돈다.
      # 실패는 /fail 로 즉시 알린다 — 핑을 그냥 안 보내면 grace(6시간)를 다 기다려야
      # 경보가 뜨고, 그러면 하루에 한 번 도는 이 체크는 반응이 너무 늦다.
      - name: Report to healthchecks.io
        if: always()
        env:
          HC: ${{ secrets.HEALTHCHECKS_PING_URL }}
          OK: ${{ steps.ping.outputs.status }}
        run: |
          if [ -z "$HC" ]; then
            echo "::notice::HEALTHCHECKS_PING_URL 미설정 — 핑 생략"
            exit 0
          fi
          if [ "$OK" = "ok" ]; then
            # -o /dev/null: 응답 본문을 로그에 남기지 않는다. URL 자체도 출력하지 않는다.
            curl -fsS -m 10 -o /dev/null "$HC" && echo "healthchecks: up 보고" || echo "::warning::healthchecks 핑 실패(무시)"
          else
            curl -fsS -m 10 -o /dev/null "$HC/fail" && echo "healthchecks: fail 보고" || echo "::warning::healthchecks fail 핑 실패(무시)"
          fi
